{% extends "base.html" %}

{% block title %}NyayaFlow - Admin Console{% endblock %}

{% block content %}
<section class="admin-header">
    <h2>Administrator Console</h2>
    <p>Review AI outputs, approve or reject settlement drafts, and manage cases.</p>
</section>

<section id="adminCases" class="admin-cases">
    <p class="loading">Loading cases...</p>
</section>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = '/login';

async function loadAdminCases() {
    try {
        const res = await fetch('/admin/cases', {headers: {'Authorization': 'Bearer ' + token}});
        if (res.status === 403) { document.getElementById('adminCases').innerHTML = '<p class="error">Access denied. Admin role required.</p>'; return; }
        if (res.status === 401) { logout(); return; }
        const cases = await res.json();
        const container = document.getElementById('adminCases');

        if (!cases.length) {
            container.innerHTML = '<p class="empty">No cases in the system.</p>';
            return;
        }

        container.innerHTML = cases.map(c => `
            <div class="admin-case-card">
                <div class="case-header">
                    <h4>${escapeHtml(c.title)}</h4>
                    <span class="status-badge status-${c.status}">${c.status}</span>
                </div>
                <p><strong>Parties:</strong> ${escapeHtml(c.party_a_name)} vs ${escapeHtml(c.party_b_name)}</p>
                <p><strong>Type:</strong> ${c.dispute_type || 'Unclassified'} | <strong>Created:</strong> ${new Date(c.created_at).toLocaleDateString()}</p>
                <div class="admin-actions">
                    <textarea id="notes_${c.id}" rows="2" placeholder="Review notes..."></textarea>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="reviewCase(${c.id}, 'approved')">Approve</button>
                        <button class="btn btn-danger" onclick="reviewCase(${c.id}, 'rejected')">Reject</button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (err) {
        document.getElementById('adminCases').innerHTML = '<p class="error">Failed to load cases</p>';
    }
}

async function reviewCase(caseId, decision) {
    const notes = document.getElementById('notes_' + caseId).value;
    try {
        const res = await fetch('/admin/review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
            body: JSON.stringify({case_id: caseId, decision: decision, notes: notes})
        });
        if (res.ok) {
            alert('Case ' + decision + ' successfully');
            loadAdminCases();
        } else {
            alert('Review action failed');
        }
    } catch (err) {
        alert('Network error');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

loadAdminCases();
</script>
{% endblock %}
