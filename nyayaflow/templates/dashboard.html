{% extends "base.html" %}

{% block title %}NyayaFlow - Dashboard{% endblock %}

{% block content %}
<section class="dashboard-header">
    <h2>My Cases</h2>
    <a href="/case/new" class="btn btn-primary">+ New Case</a>
</section>

<section id="casesList" class="cases-list">
    <p class="loading">Loading cases...</p>
</section>

<script>
async function loadCases() {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; return; }

    try {
        const res = await fetch('/cases/my', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        if (res.status === 401) { logout(); return; }
        const cases = await res.json();
        const container = document.getElementById('casesList');

        if (!cases.length) {
            container.innerHTML = '<p class="empty">No cases yet. Click "New Case" to file a dispute.</p>';
            return;
        }

        container.innerHTML = cases.map(c => `
            <div class="case-card">
                <div class="case-header">
                    <h4><a href="/case/${c.id}">${escapeHtml(c.title)}</a></h4>
                    <span class="status-badge status-${c.status}">${c.status}</span>
                </div>
                <p class="case-meta">Type: ${c.dispute_type || 'Not classified'} | Created: ${new Date(c.created_at).toLocaleDateString()}</p>
                <p class="case-desc">${escapeHtml(c.description || 'No description')}</p>
            </div>
        `).join('');
    } catch (err) {
        document.getElementById('casesList').innerHTML = '<p class="error">Failed to load cases. Ensure backend is running.</p>';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadCases();
</script>
{% endblock %}
